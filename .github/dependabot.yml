# Dependabot version updates: opens PRs when npm dependencies have new
# releases. Separate from Dependabot security alerts and automated security
# fix PRs, which are enabled in the repo settings and arrive as soon as an
# advisory is published.
#
# Merging a PR deploys to production (Netlify builds every push to main).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR for all patch and minor updates; each major upgrade (React 19,
      # Tailwind 4, Vite 8, ESLint 10, …) gets its own PR to review separately.
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # ESLint 10: eslint-plugin-react (7.37.x) only supports ESLint up to 9,
      # so the install fails. Remove once eslint-plugin-react supports 10.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: chore
      include: scope

  # Actions used in .github/workflows (actions/checkout, actions/setup-node)
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # One PR for all action updates instead of one per action
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: ci
